# /etc/nginx/conf.d/cyberalertx-log.conf
#
# Defines ONE http-level log_format, `cax_json`, consumed by the visitor
# analytics tool (`python -m server.analytics`). Nothing else lives here.
#
# INSTALL: copy to /etc/nginx/conf.d/cyberalertx-log.conf, then `nginx -t`.
#   nginx.conf includes conf.d/*.conf (line 59) BEFORE sites-enabled/* (line 60),
#   both inside http{}. That order matters: a format must be defined before the
#   server block that names it, or the reload fails with
#   `[emerg] unknown log format "cax_json"`. Install this file FIRST, the vhost
#   second; remove them in the reverse order.
#
# THIS FILE ALONE CHANGES NOTHING. `log_format` only names a template; it is
# inert until some `access_log` directive references it by name. The three other
# vhosts on this box never mention `cax_json`, so
# installing this file leaves their logging byte-identical. That is deliberate:
# it makes step 3 of the apply runbook a zero-risk test of the format's syntax
# with nothing yet depending on it.
#
# `log_format` is valid in the http context ONLY — not in server{} or location{}
# — which is why this cannot simply live inside the cyberalertx vhost.
#
# ---------------------------------------------------------------------------
# HOW A PARSER SPLITS IT
#
# One JSON object per line, so the whole parser is:
#
#     rec = json.loads(line)          # line starts with "{"
#
# There is no positional splitting, no regex, no field-count assumption, and a
# field added here later cannot shift the meaning of an existing one. Detection
# is per LINE, not per file, because a rotated file spans the reload boundary
# and legitimately holds both formats: a line starting with `{` is this format
# (dispatch on `rec["v"]`), anything else is tried against the legacy combined
# regex, and a line matching neither is counted as unparseable rather than
# raising.
#
# TWO HARD RULES ABOUT THE DIRECTIVE BELOW. Both are load-bearing; changing
# either breaks the parser on the site's most common line shape.
#
#  1. EVERY VALUE IS QUOTED, INCLUDING THE NUMERIC ONES. nginx does not build
#     the JSON — it only escapes variable *values*. The braces, colons and
#     quotes below are literal text we write by hand. On any response that never
#     reached an upstream (a redirect, a /brand/ static hit, any 4xx) an unquoted
#     `"ut":$upstream_response_time` emits the literal line
#
#         {"st":"200","ut":}
#
#     — measured, not assumed — and `json.loads` dies on it with
#     `Expecting value: line 1 column 18`. (Under nginx's DEFAULT escaping the
#     same slot emits `"ut":-`, equally invalid.) Quote everything here and cast
#     in Python, where a missing value is a normal outcome instead of a crash.
#
#  2. `escape=json` RENDERS A MISSING VARIABLE AS "", NOT "-". So an absent
#     header and a present-but-empty header look identical on the wire. Do not
#     "fix" this by adding a companion boolean field — recover it in Python:
#     `chua` is non-empty on every Chromium request, so `chua != "" and
#     chmd == ""` is desktop Chromium reporting a genuinely empty model, while
#     `chua == ""` is a browser that sends no hints at all. Documented at the
#     point of use in server/analytics/logread.py.
#
# `escape=json` also does the one job that matters for safety: it escapes the
# quotes, backslashes and control bytes that arrive inside attacker-controlled
# headers, so a hostile User-Agent cannot inject a second JSON object or
# terminate the line early.
#
# Request headers appear as `$http_<name>` with the name lowercased and dashes
# turned into underscores — `Sec-CH-UA-Model` is `$http_sec_ch_ua_model`. An
# undeclared `$http_*` is not a config error; it is simply empty.
# ---------------------------------------------------------------------------

log_format cax_json escape=json
    '{'
    # -- identity of the record ---------------------------------------------
    '"v":"1",'                      # format version, literal. First key on
                                    # every line, so format detection and any
                                    # future migration are a dict lookup rather
                                    # than a guess. Bump it if a field's
                                    # MEANING changes; adding a field does not.
    '"t":"$time_iso8601",'          # 2026-09-02T12:38:45+03:00. No spaces,
                                    # lexically sortable, and it carries the UTC
                                    # offset. THE OFFSET IS DATA, NOT A
                                    # CONSTANT: this box logs +0300 (Europe/Kyiv)
                                    # and shifts with DST. Parse it; never
                                    # assume UTC. Preferred over $time_local,
                                    # which contains a space and needs bracket
                                    # quoting.
    '"h":"$host",'                  # the vhost that served this request.
                                    # cyberalertx is the effective default
                                    # server for 0.0.0.0:{80,443} — no vhost
                                    # declares default_server and this one sorts
                                    # first — so every IP-direct scanner and
                                    # unmatched-Host probe on the box lands in
                                    # this log. Without $host the "audience" is
                                    # mostly scanners.

    # -- who sent it ---------------------------------------------------------
    '"ip":"$remote_addr",'          # AFTER real_ip substitution this is the
                                    # true visitor IP (see the vhost's
                                    # set_real_ip_from block). Never printed and
                                    # never stored raw — the tool hashes it with
                                    # a daily-rotated salt.
    '"pip":"$realip_remote_addr",'  # the actual socket peer, i.e. the
                                    # Cloudflare edge IP. This is the evidence
                                    # that the request really traversed
                                    # Cloudflare, and it is the input to the
                                    # single strongest bot filter on this site:
                                    # the origin is directly reachable, so any
                                    # request whose peer is outside Cloudflare's
                                    # published ranges is a direct-to-origin
                                    # probe, not audience. It also makes every
                                    # real_ip substitution auditable after the
                                    # fact. If ip == pip, real_ip is not firing.

    # -- what they asked for -------------------------------------------------
    '"m":"$request_method",'        # split out from $request, which fuses three
                                    # fields with spaces and collapses to "-" on
                                    # a malformed request line. HEAD and OPTIONS
                                    # are never pageviews.
    '"u":"$request_uri",'           # WITH the query string, deliberately: both
                                    # the ?_rsc= soft-navigation marker and the
                                    # UTM parameters live there.
    '"pr":"$server_protocol",'      # HTTP/1.1 vs HTTP/2.0. Logs "-" on a
                                    # malformed request line, which is itself a
                                    # useful malformation marker.
    # -- what they got back --------------------------------------------------
    '"st":"$status",'               # pageview gate (200/304 only), 404 analysis,
                                    # 5xx health.
    '"bs":"$body_bytes_sent",'      # did the page body actually transfer.
    '"bt":"$bytes_sent",'           # body PLUS response headers — the correct
                                    # figure for bandwidth accounting.
    '"rt":"$request_time",'         # wall-clock seconds, includes time spent
                                    # streaming to a slow client.
    '"ut":"$upstream_response_time",'  # the server-side half. The gap between rt
                                    # and ut IS the client-network story. Can be
                                    # a comma-separated LIST on upstream
                                    # retries, and "-" when no upstream was
                                    # involved — parse defensively.

    # -- how they connected ----------------------------------------------------
    '"sch":"$scheme",'              # separates the direct-origin probes that
                                    # arrive on :80 from real HTTPS traffic.

    # -- Cloudflare-injected ---------------------------------------------------
    '"cc":"$http_cf_ipcountry",'    # two-letter country, free on every CF plan,
                                    # but ONLY if the "Add visitor location
                                    # headers" Managed Transform (the IP
                                    # Geolocation toggle) is ON. Three distinct
                                    # non-country outcomes to handle: "" (did
                                    # not traverse CF, or the toggle is off),
                                    # "XX" (CF has no data), "T1" (Tor).
    '"ray":"$http_cf_ray",'         # <16 hex>-<COLO>. Always present on
                                    # CF-proxied traffic, independent of the
                                    # geolocation toggle, so it is the honest
                                    # test of "did this come through the edge".
                                    # The 3-letter suffix is the CF datacentre
                                    # IATA code — free coarse geography, and a
                                    # correlation key against Cloudflare's own
                                    # dashboard. Also the stale-range self-check:
                                    # a line with a ray but a pip outside our
                                    # compiled CF ranges means the list in the
                                    # vhost needs refreshing.

    # -- client-declared headers (all attacker-controllable: never trusted alone)
    '"ref":"$http_referer",'        # acquisition channel. Empty is normal and
                                    # is NOT a bot signal — Telegram's in-app
                                    # browser sends no Referer at all.
    '"ua":"$http_user_agent",'      # browser / OS / device, and the bot
                                    # signature table. Routinely FORGED on this
                                    # site, so it is evaluated only after the
                                    # Cloudflare-provenance test above.
    '"al":"$http_accept_language",' # sent by essentially every browser, unlike
                                    # client hints, which makes it the single
                                    # best input to the EN/UA audience question.

    # -- Next.js App Router navigation shape -----------------------------------
    '"rsc":"$http_rsc",'            # "1" marks a React Server Component fetch,
                                    # i.e. a soft in-app navigation rather than
                                    # a document load.
    '"pf":"$http_next_router_prefetch",'  # THE HIGHEST-SEVERITY FIELD IN THIS
                                    # FORMAT. LanguageSwitcher.tsx:61 passes
                                    # prefetch={active ? false : undefined}, and
                                    # undefined is Next's viewport-based
                                    # default. The switcher sits in the
                                    # always-visible header, so EVERY EN
                                    # pageview fires an RSC prefetch of the
                                    # mirror /ua URL, and vice versa. Without
                                    # this header the EN/UA split converges on
                                    # 50/50 BY CONSTRUCTION and the report
                                    # destroys the one signal the site owner
                                    # most wants. Prefetches are dropped from
                                    # pageviews entirely.
    '"sfm":"$http_sec_fetch_mode",' # "navigate" confirms a hard navigation.
    '"sfd":"$http_sec_fetch_dest",' # "document" confirms the same independently.
    '"sp":"$http_sec_purpose",'     # "prefetch" — the standards-track second
                                    # opinion on pf, for browsers that send it.

    # -- User-Agent Client Hints -----------------------------------------------
    # chua / chp / chm are low-entropy and arrive by default on Chromium.
    # chpv / chmd are high-entropy: they are empty unless the vhost's
    # `add_header Accept-CH ...` opted in, and they arrive one navigation LATE
    # (the browser learns of the request only after the first response), so the
    # landing hit of a cold visit never carries them. Chromium-only throughout:
    # expect zero from Firefox and Safari. A bonus column, never a basis for a
    # device-model breakdown.
    '"chua":"$http_sec_ch_ua",'     # low-entropy brand list. Doubles as the
                                    # "is this a hint-sending browser at all"
                                    # probe — see hard rule 2 above.
    '"chp":"$http_sec_ch_ua_platform",'  # closed enum: "Android", "Chrome OS",
                                    # "Chromium OS", "iOS", "Linux", "macOS",
                                    # "Windows", "Unknown". Distinguishes
                                    # iPadOS-in-desktop-mode from real macOS,
                                    # which the UA string cannot.
    '"chpv":"$http_sec_ch_ua_platform_version",'  # the ONLY way to split
                                    # Windows 11 from Windows 10 — both send
                                    # platform "Windows" and both freeze the UA
                                    # at "Windows NT 10.0". Value is the Windows
                                    # UniversalApiContract number: >= 13 => 11,
                                    # 1-12 => 10, 0 => older. TREAT THAT
                                    # THRESHOLD AS UNVERIFIED and calibrate
                                    # against real logs before publishing a
                                    # Win10/11 split.
    '"chm":"$http_sec_ch_ua_mobile",'  # structured-field boolean ?1 / ?0. Fixes
                                    # Android desktop-mode misattribution:
                                    # "Request desktop site" on Chrome Android
                                    # sends the Linux DESKTOP UA string but does
                                    # not spoof this header.
    '"chmd":"$http_sec_ch_ua_model"'   # the real device model, defeating the "K"
                                    # placeholder that Android's reduced UA
                                    # sends in place of a model name. NOTE: no
                                    # trailing comma — this is the last field.
    '}';

# ---------------------------------------------------------------------------
# DELIBERATELY EXCLUDED, so nobody re-adds them:
#   $request                 three fields fused by spaces; collapses to "-" on a
#                            malformed request line. m/u/pr carry it split.
#   $ssl_protocol            behind Cloudflare this is the ORIGIN<->CF TLS
#   $ssl_cipher              version, not the visitor's browser. Analytically
#                            worthless here, and actively misleading.
#   $http_cf_connecting_ip   raw unvalidated header text. `ip` after real_ip is
#                            the validated equivalent; logging both invites
#                            someone to trust the wrong one.
#   $binary_remote_addr      binary; not loggable.
# ---------------------------------------------------------------------------
