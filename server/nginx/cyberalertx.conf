# /etc/nginx/sites-available/cyberalertx
#
# Reverse proxy: same domain for frontend and API.
#   /posts, /healthz, /admin, /feedback   →  FastAPI :8000
#   /brand/*                              →  Next.js public/ (direct static)
#   /                                     →  Next.js :3000
#
# SSL via Cloudflare Origin Certificate (15-year validity).
# Set Cloudflare SSL mode to "Full (strict)" for end-to-end TLS.

# HTTP → HTTPS redirect. Cloudflare normally does this at edge, but the
# block catches direct origin hits (probes, manual curl).
server {
    listen 80;
    server_name cyberalertx.com www.cyberalertx.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cyberalertx.com www.cyberalertx.com;

    ssl_certificate     /etc/ssl/cyberalertx/origin.crt;
    ssl_certificate_key /etc/ssl/cyberalertx/origin.key;

    # --- Cloudflare real client IP (scoped to THIS server block only) --------
    # Restores the visitor's IP into $remote_addr and keeps the Cloudflare edge
    # IP in $realip_remote_addr. Scoped here at server level, so the three other
    # vhosts on this box are provably unaffected.
    #
    # set_real_ip_from is NOT optional, and it is the whole security story of
    # this block. real_ip_header on its own would let ANYONE who can reach the
    # origin dictate their own logged IP just by sending the header themselves
    # — and this origin IS directly reachable, since cyberalertx is the
    # effective default server for 0.0.0.0:443. The from-list is what makes the
    # header trustworthy: nginx honours it only when the connection's real peer
    # is inside one of these ranges, and ignores it otherwise.
    #
    # Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6, fetched
    # 2026-09-02, cross-checked against https://api.cloudflare.com/client/v4/ips
    # (etag 38f79d050aa027e3be3865e495dcc9bc).
    #
    # MAINTENANCE BURDEN — read before ignoring this list for a year. Cloudflare
    # adds ranges occasionally, and nothing here updates itself. Stale ranges
    # fail CLOSED, not open: a request from a new, not-yet-trusted CF range logs
    # the edge IP instead of the visitor. That is degraded analytics (the
    # request looks direct-to-origin and gets filtered out as a probe), never a
    # security hole and never an outage. The symptom is a rising
    # "direct-to-origin" share on traffic that is plainly human, and the
    # analytics report cross-checks it: a line carrying a CF-Ray but a peer IP
    # outside these ranges means the list below is out of date. Re-check with:
    #   curl -s https://api.cloudflare.com/client/v4/ips | grep -o '"etag":"[^"]*"'
    # Do NOT auto-fetch-and-rewrite this from cron: that is an unattended write
    # to system config on a box serving four vhosts.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    # real_ip_recursive is deliberately NOT set. It only disambiguates a
    # multi-value header, and CF-Connecting-IP carries exactly one IP, so the
    # default (off) is correct. Do NOT switch this to X-Forwarded-For: behind
    # Cloudflare that header is "visitor, cf-edge", it needs real_ip_recursive
    # on to unwrap, and a client can poison it by prepending fake entries.
    # CF-Connecting-IP is written by Cloudflare and cannot be extended by the
    # client.

    # --- Dedicated analytics log ---------------------------------------------
    # A server-level access_log REPLACES the inherited http-level one, so
    # cyberalertx lines stop appearing in the shared /var/log/nginx/access.log.
    # That is intentional and verified safe: nothing consumes cyberalertx lines
    # from the shared file: fail2ban has only an [sshd] jail, no goaccess or
    # awstats is installed, and the one sibling script that reads it filters on
    # its own routes. Re-verify before assuming this still holds. The http-level
    # access_log is untouched, so every other vhost keeps writing to
    # access.log with byte-identical behaviour.
    #
    # Named .jsonl, NOT .log, and the extension is load-bearing:
    # /etc/logrotate.d/nginx globs /var/log/nginx/*.log and is shared with those
    # three vhosts. A .log name here would be claimed by BOTH that shared config
    # and our own 365-day one, which is a logrotate "duplicate log entry" error
    # — it skips the entry and the 365-day retention silently never applies.
    # See server/logrotate/cyberalertx-access.
    access_log /var/log/nginx/cyberalertx-access.jsonl cax_json;

    # --- Security headers (Wapiti hardening) ---------------------------------
    # Inherited by `location /` and the API location (neither sets its own
    # add_header). Cloudflare forwards origin response headers, so these also
    # reach the client through the edge. TLS-version / HSTS are managed at
    # Cloudflare (Min TLS 1.2 + HSTS toggle); HSTS is also set here for direct
    # origin hits. `always` so error responses get them too.
    add_header X-Frame-Options        "DENY"                                     always;  # clickjacking
    add_header X-Content-Type-Options "nosniff"                                  always;  # MIME sniffing
    add_header Referrer-Policy        "strict-origin-when-cross-origin"          always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"   always;
    # CSP starts in REPORT-ONLY: it logs violations without blocking, so it
    # cannot break the live site. Watch the browser console / Cloudflare NEL,
    # confirm Next.js + Umami load clean, then rename this header to
    # `Content-Security-Policy` (drop `-Report-Only`) to enforce and close the
    # finding. `'unsafe-inline'` is required for Next.js App Router's inline
    # hydration scripts; `cloud.umami.is` is the analytics tracker.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; connect-src 'self' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Opt in to the two high-entropy client hints the analytics log wants
    # (Sec-CH-UA-Platform-Version splits Windows 10 from 11; Sec-CH-UA-Model
    # defeats Android's "K" placeholder). Without this header those two fields
    # are permanently empty.
    #
    # MUST live at server level, beside the other add_header lines. nginx's
    # add_header inheritance is REPLACE, not merge: any add_header inside a
    # location discards the entire parent set. `location /brand/` already
    # demonstrates that pre-existing bug — it sets Cache-Control and
    # consequently returns ZERO security headers. Putting Accept-CH in a
    # location would silently strip HSTS and the CSP from that location.
    #
    # No matching Vary: header. Vary only matters when the CONTENT differs per
    # hint, which it does not here, and `Vary: Sec-CH-UA-Model` would fragment
    # Cloudflare's edge cache across every device model.
    # No Critical-CH either: it forces the browser to retry the navigation so
    # the first request carries hints, at the cost of a doubled first
    # navigation on every cold visit. MDN says production use is not
    # recommended, and aggregate stats do not need the landing hit.
    #
    # The existing Permissions-Policy does NOT restrict client hints: unlisted
    # features keep their default `self` allowlist for ch-* tokens, so no edit
    # is needed there.
    add_header Accept-CH "Sec-CH-UA-Platform-Version, Sec-CH-UA-Model, Sec-CH-UA-Full-Version-List" always;

    # Feedback POST is tiny. Cap at 64KB to discourage abuse.
    client_max_body_size 64k;

    # Cloudflare gzips at edge but origin gzip helps when bypassed.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API endpoints — FastAPI on :8000
    location ~ ^/(posts|healthz|admin|feedback)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Brand static — serve directly from disk (skips Next.js round-trip).
    location /brand/ {
        alias /home/cax/cax/frontend/public/brand/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else → Next.js on :3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
