name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel older runs on the same branch — saves CI minutes when you push
# rapidly and only the latest commit matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Backend — Python tests. Live Postgres tests are gated by env and
  # skip cleanly here because CYBERALERTX_TEST_DB_URL is not set.
  # ------------------------------------------------------------------
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Production runs Python 3.12 (Ubuntu 24.04) from requirements.lock;
          # CI tests that exact set, not the looser ranges in requirements.txt.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip check

      - name: Type-check (mypy)
        # Strict type checking over the cyberalertx package; config lives in
        # pyproject.toml [tool.mypy]. Runs before pytest so a type regression
        # fails fast with a clear signal.
        run: mypy

      - name: Run pytest
        run: pytest -q --tb=short

  # ------------------------------------------------------------------
  # Frontend — Next.js production build. `next build` already runs the
  # TypeScript compiler internally, so type errors fail the job. We
  # intentionally skip a separate lint step: ESLint isn't configured in
  # the repo, and `next lint` is deprecated as of Next.js 15 (it prompts
  # for an interactive setup that hangs in CI).
  # ------------------------------------------------------------------
  frontend:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # Build hits /healthz during static-page generation; with no API
          # up in CI, fetch fails — the page still renders via fallback.
          # Telemetry off to keep logs clean.
          NEXT_TELEMETRY_DISABLED: "1"

  # ------------------------------------------------------------------
  # No deploy job. The former "Deploy to VPS" job SSHed in and ran
  # server/deploy.sh: `git reset --hard origin/main` in the old ~/cax
  # checkout, pip/npm into the old environment and a restart of the live
  # API and frontend. Production now runs from immutable release
  # directories (/home/cax/cyberalertx/releases, `current` symlink), and
  # that job would overwrite the rollback checkout and restart services
  # outside the release procedure (OPEN_ISSUES O33); the script itself was
  # removed on 5 Nov 2026. Deploy with docs/operations/OPERATIONS.md.
  # ------------------------------------------------------------------
